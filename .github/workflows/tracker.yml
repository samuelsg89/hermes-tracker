name: Hermes SG bag watch

on:
  workflow_dispatch: {}
  schedule:
    # Hourly, offset from the top of the hour. Note: GitHub's native
    # `schedule` trigger is best-effort and can lag or skip during high load
    # (the sibling ovenbird-tracker project saw multi-hour gaps and switched
    # to an external cron-job.org trigger hitting workflow_dispatch instead -
    # worth doing the same here if hourly reliability turns out to matter).
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: hermes-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: playwright install --with-deps chromium

      - name: Run tracker
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python tracker.py --once

      - name: Persist state
        run: |
          git config user.name "hermes-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update tracker state [skip ci]"
          git push
